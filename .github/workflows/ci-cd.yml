name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r reverse_rule_workflow/requirements.txt

      - name: Lint
        run: |
          . .venv/bin/activate
          ruff check app/ reverse_rule_workflow/app/ rag-service/app/
          ruff format --check app/ reverse_rule_workflow/app/ rag-service/app/

      - name: Type Check
        run: |
          . .venv/bin/activate
          mypy app/ reverse_rule_workflow/app/ || true

      - name: Test
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -v --tb=short
          cd reverse_rule_workflow && python -m pytest tests/ -v --tb=short

      - name: Syntax Check
        run: |
          . .venv/bin/activate
          python -m compileall -q app reverse_rule_workflow/app rag-service/app

      - name: Import Check
        run: |
          . .venv/bin/activate
          python -c "from app.main import app; print(app.title)"
